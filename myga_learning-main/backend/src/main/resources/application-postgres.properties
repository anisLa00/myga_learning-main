# ---------------------------------------------------------------------------
# PostgreSQL profile — activate with:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
#   java -jar backend.jar --spring.profiles.active=postgres
#
# H2 remains the default for local development; this profile only overrides
# the datastore, so no application code changes between the two.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/myga}
spring.datasource.username=${DB_USERNAME:myga}
spring.datasource.password=${DB_PASSWORD:myga}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep the schema across restarts (unlike the in-memory H2 default).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# The H2 console has no place outside the H2 profile.
spring.h2.console.enabled=false
