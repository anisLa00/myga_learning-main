server.port=8080

# ---------------------------------------------------------------------------
# H2 in-memory database (development profile)
# DB_CLOSE_ON_EXIT=FALSE avoids the noisy "Database is already closed" warning
# emitted by the JVM shutdown hook when the context closes.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:myga;DATABASE_TO_UPPER=false;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
