server.port=8080

# ---------------------------------------------------------------------------
# H2 in-memory database (development profile)
# DB_CLOSE_ON_EXIT=FALSE avoids the noisy "Database is already closed" warning
# emitted by the JVM shutdown hook when the context closes.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:myga;DATABASE_TO_UPPER=false;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Security / JWT
# The signing secret and the seeded admin credentials below are DEVELOPMENT
# defaults. Override them with environment variables for anything real:
#   JWT_SECRET, APP_ADMIN_EMAIL, APP_ADMIN_PASSWORD
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:change-me-please-this-is-a-dev-only-secret-key-of-at-least-32-bytes}
# Token lifetime in milliseconds (default 24h).
jwt.expiration-ms=86400000

# Seeded default administrator (created on startup only if no admin exists).
app.admin.email=${APP_ADMIN_EMAIL:admin@myga.local}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.admin.nom=${APP_ADMIN_NOM:Admin}
app.admin.prenom=${APP_ADMIN_PRENOM:System}
